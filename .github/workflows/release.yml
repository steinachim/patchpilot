# Creates the GitHub Release when a vX.Y tag is pushed: builds, tests and lints the signed APK,
# then publishes it with the matching "## X.Y" section of CHANGELOG.md as the release notes. See
# docs/RELEASING.md.
#
# Two jobs, so the token that can write to the repository is never on the machine running the
# build and its third-party plugins: `build` gets a read-only token, `publish` the write one and
# nothing but the finished APK and notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Read-only, and cold in practice: the only cache a tag build can read is dev's, which no
      # workflow writes, so a release builds from scratch.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set - releases must be signed"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/patchpilot-release.jks
          {
            echo "RELEASE_STORE_FILE=keystore/patchpilot-release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties

      # A release is gated on what a pull request is: the tests and lint, beside the build.
      - name: Test, lint and build the release APK
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      # The tag is "vX.Y"; the changelog heading is "## X.Y" with no "v" and no date. Written to a
      # file rather than into a command line, so no character in the notes is ever shell syntax,
      # and beside the APK, so the artifact holds both at its root.
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=app/build/outputs/apk/release/release-notes.md
          sed -n "/^## ${version}\$/,/^## /p" ../CHANGELOG.md | sed '1d;$d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::No '## ${version}' section found in CHANGELOG.md"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            android/app/build/outputs/apk/release/patchpilot-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              "patchpilot-$GITHUB_REF_NAME.apk" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
