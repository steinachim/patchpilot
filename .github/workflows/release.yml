# Creates the GitHub Release when a vX.Y tag is pushed: checks formatting, tests and lints, builds
# the signed APK, then publishes it and R8's mapping file with the matching "## X.Y" section of
# CHANGELOG.md as the release notes. See docs/RELEASING.md.
#
# Two jobs, so the token that can write to the repository is never on the machine running the
# build and its third-party plugins: `build` gets a read-only token, `publish` the write one and
# nothing but the finished APK and notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Floats: the newest Temurin 17 on the current ubuntu-latest image. This step's log names
      # the exact JDK; docs/RELEASING.md treats a change from the last release as a JDK bump.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 17

      # Read-only, and cold in practice: the only cache a tag build can read is dev's, which no
      # workflow writes, so a release builds from scratch.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true

      # A release is gated on what a pull request is: formatting, the tests and lint, then the
      # build of both outputs. The key goes on disk only after the steps that do not need it.
      - name: Check formatting, test and lint
        run: ./gradlew spotlessCheck testDebugUnitTest lintRelease

      - name: Install release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set - releases must be signed"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/patchpilot-release.jks
          # Properties.load reads a backslash as an escape, so each is doubled to arrive as written.
          esc() { printf '%s' "${1//\\/\\\\}"; }
          {
            echo "RELEASE_STORE_FILE=keystore/patchpilot-release.jks"
            echo "RELEASE_STORE_PASSWORD=$(esc "$RELEASE_STORE_PASSWORD")"
            echo "RELEASE_KEY_ALIAS=$(esc "$RELEASE_KEY_ALIAS")"
            echo "RELEASE_KEY_PASSWORD=$(esc "$RELEASE_KEY_PASSWORD")"
          } > local.properties

      - name: Build the release APK and bundle
        run: ./gradlew assembleRelease bundleRelease

      # The tag is "vX.Y"; the changelog heading is "## X.Y" with no "v" and no date. Written to a
      # file rather than into a command line, so no character in the notes is ever shell syntax,
      # and beside the APK, so the artifact holds both at its root.
      - name: Collect the release notes and the mapping
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=app/build/outputs/apk/release/release-notes.md
          # R8's mapping, which only this build can produce: without it a stack trace from this
          # release cannot be read. Beside the APK, so the artifact keeps its flat layout.
          cp app/build/outputs/mapping/release/mapping.txt \
              "app/build/outputs/apk/release/patchpilot-${GITHUB_REF_NAME}-mapping.txt"
          sed -n "/^## ${version}\$/,/^## /p" ../CHANGELOG.md | sed '1d;$d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::No '## ${version}' section found in CHANGELOG.md"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            android/app/build/outputs/apk/release/patchpilot-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/patchpilot-${{ github.ref_name }}-mapping.txt
            android/app/build/outputs/apk/release/release-notes.md
          if-no-files-found: error
          retention-days: 1

      # A failed gate leaves its test and lint reports, which the log alone does not carry. Only
      # the report directories: never the keystore or local.properties.
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              "patchpilot-$GITHUB_REF_NAME.apk" \
              "patchpilot-$GITHUB_REF_NAME-mapping.txt" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md

  # A tag whose gate failed has no release, so it is deleted: the name is free for a retag once
  # the cause is fixed. Its own job, so `build` keeps its read-only token; it runs nothing from
  # the repository. Only after a failed build (not a cancelled one, not a failed `publish`), and
  # never for a tag that already has a release, such as a re-run of an old one.
  remove-failed-tag:
    needs: build
    if: needs.build.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Delete the tag unless it has a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            echo "::warning::$GITHUB_REF_NAME has a release: the tag stays."
            exit 0
          fi
          # Delete only on a definite "not found"; any other error leaves the tag alone.
          case "$out" in
            *"release not found"*) ;;
            *) echo "::error::Could not tell whether $GITHUB_REF_NAME has a release: $out"; exit 1 ;;
          esac
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME"
          echo "::notice::$GITHUB_REF_NAME deleted after a failed release build. Retag once fixed; locally: git tag -d $GITHUB_REF_NAME"
